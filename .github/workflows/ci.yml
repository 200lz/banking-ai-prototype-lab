name: Quality and safety regression
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AGENT_MODE: local
      RETRIEVAL_BACKEND: local
      API_AUTH_MODE: local
      NEXT_TELEMETRY_DISABLED: "1"
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install exact tested dependencies
        run: make setup
      - name: Formatting and linting
        run: make lint
      - name: Type checking
        run: make typecheck
      - name: Unit and API integration tests; infrastructure security assertions
        run: make test
      - name: Evaluation smoke gates
        run: .venv/bin/python -m packages.evals.run --smoke --output evals/results/ci-smoke.json
      - name: Full evaluation gates
        run: make eval
      - name: Security analysis and dependency vulnerability audits
        run: make security
      - name: Production web build
        run: npm --prefix apps/web run build
      - name: CDK synth without credentials
        run: make synth
      - name: Install checksum-verified secret scanner
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
      - name: Scan repository candidate files for secrets
        run: .venv/bin/python scripts/check_secrets.py --gitleaks /tmp/gitleaks-bin/gitleaks
      - name: Scan complete Git history for secrets
        run: /tmp/gitleaks-bin/gitleaks git --redact=100 --no-banner
      - name: Fresh container build, health, scenarios, telemetry, restart and cleanup
        run: .venv/bin/python scripts/verify_containers.py --output docs/validation/containers-latest.json
      - name: Preserve evaluation and synthesized template
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-and-infrastructure
          path: |
            evals/results/*.json
            infra/cdk/cdk.out/*.template.json
            docs/validation/containers-latest.json
