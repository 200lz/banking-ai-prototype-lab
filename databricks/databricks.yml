bundle:
  name: banking-ai-synthetic-financial

variables:
  catalog:
    description: Existing Unity Catalog catalog permitted for this synthetic development job
  schema:
    description: Dedicated synthetic development schema
    default: banking_ai_synthetic
  wheel_path:
    description: Absolute /Volumes path to the uploaded SHA-256-verified financial-only wheel

# Sources remain available for inspection; the runtime reads only the installed Volume wheel.
sync:
  paths:
    - ../packages/financial
    - ../data/synthetic
    - .
  exclude:
    - '**/__pycache__/**'
    - .databricks/**

resources:
  jobs:
    financial_pipeline:
      name: banking-ai-synthetic-financial
      max_concurrent_runs: 1
      timeout_seconds: 900
      tasks:
        - task_key: publish_gold
          environment_key: financial
          max_retries: 0
          retry_on_timeout: false
          disable_auto_optimization: true
          python_wheel_task:
            package_name: banking_ai_financial
            entry_point: publish
            parameters:
              - --catalog
              - ${var.catalog}
              - --schema
              - ${var.schema}
      environments:
        - environment_key: financial
          spec:
            environment_version: '2'
            dependencies:
              - pydantic==2.13.5
              - ${var.wheel_path}

targets:
  dev:
    default: true
    mode: development
