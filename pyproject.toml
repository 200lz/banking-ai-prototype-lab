[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-ai-prototype-lab"
version = "0.1.0"
description = "Synthetic, evidence-grounded financial operations agent lab"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.135,<1", "uvicorn>=0.34,<1", "pydantic>=2.12,<3",
  "mangum>=0.19,<1", "boto3>=1.40,<2",
  "opentelemetry-api>=1.36,<2", "opentelemetry-sdk>=1.36,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "strands-agents>=1.0,<2",
  "databricks-sdk==0.136.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1",
  "ruff>=0.12,<1", "mypy>=1.15,<2", "bandit>=1.8,<2", "pip-audit>=2.9,<3"]
aws = ["aws-cdk-lib>=2.200,<3", "constructs>=10,<11"]

[tool.setuptools.packages.find]
include = ["services*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: API or adapter integration", "aws: AWS adapter contract"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".venv", ".venv-infra", "apps/web", "infra/cdk/cdk.out", "**/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
exclude = [".venv", "apps", "infra/cdk/cdk.out", "infra/cdk/node_modules"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", ".venv", "apps", "infra/cdk/cdk.out"]
